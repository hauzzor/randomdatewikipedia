<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Random Date</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%97%92%3C/text%3E%3C/svg%3E">
    <script>
      window.showBootError = function (message) {
        var node = document.getElementById("boot-error");
        if (!node) {
          return;
        }
        node.hidden = false;
        node.textContent = message + " Press Ctrl+Shift+R to force a fresh reload.";
      };

      window.addEventListener(
        "error",
        function (event) {
          if (event.target && event.target.tagName === "SCRIPT") {
            window.showBootError("A script failed to load.");
            return;
          }
          window.showBootError("Could not start: " + (event.message || "unknown script error") + ".");
        },
        true,
      );
    </script>
    <script src="./random-date.js" defer></script>
    <script src="./wikipedia.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="clock-card" aria-labelledby="app-title">
      <p class="eyebrow">RANDOM HISTORY</p>
      <h1 id="app-title">Random Date</h1>

      <p id="date" class="date" aria-live="polite"></p>

      <p id="boot-error" class="boot-error" role="alert" hidden></p>

      <div id="article" class="article" aria-live="polite" aria-busy="false">
        <p id="article-status" class="article__status"></p>
        <a id="article-link" class="article__link" target="_blank" rel="noopener noreferrer" hidden></a>
        <p id="article-snippet" class="article__snippet"></p>
      </div>

      <div class="actions">
        <button id="random-article" class="button button--primary" type="button">Random article</button>
        <button id="new-link" class="button" type="button">New link</button>
        <button id="random-date" class="button button--ghost" type="button">New random date</button>
      </div>
    </main>
  </body>
</html>
